# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: 2026-04-24

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: peak_texture_residency
    status: active
    source: design/gdd/world-structure.md
    referenced_by:
      - design/gdd/world-structure.md
    variables: [R_always, R_active_current, R_active_outgoing, R_active_incoming]
    output_range: [0, 350]   # MB; must satisfy <= 350 per art-bible §8.9 hard cap
    expression: "R_steady = R_always + R_active_current; R_peak = R_always + R_active_outgoing + R_active_incoming"
    notes: "F1 constraint equation, two-part form (revised 2026-04-23; note-sync 2026-04-23 round-5 consistency-check — wording aligned with Rule 3, AC IDs updated for H-F1 round-3 split). Steady-state: only one zone's texture resources (the active zone's logical group-set, per Rule 1) are fully resident. Peak: mid-transition stream-ahead sub-phase with both outgoing and incoming texture groups resident. Both R_steady and R_peak must be <= 350 MB at authoring time. Build-blocking if violated. Validator must check peak form, not steady-state only. Informs H-F1-steady (Dev-build smoke, steady-state PlayMode Memory Profiler snapshot — T1-blocking) and H-F1-peak (Dev-build smoke, peak-seam snapshot per ADR-tba-4(i) resolution — ADR-gated until ADR-tba-4(i) names the prototype-defined peak observable)."
    added: 2026-04-22
    revised: 2026-04-23

  - name: zone_art_budget_ceiling
    status: active
    source: design/gdd/world-structure.md
    referenced_by:
      - design/gdd/world-structure.md
    variables: [R_cap, R_always, R_zone_peer_max]
    output_range: [0, 165]   # MB; MVP binding ceiling — revised 2026-04-23 from prior [0, 305] validator false-pass trap. T4 ceiling tightens as R_always grows with ZoneIdle count.
    expression: "R_zone_max = R_cap - R_always - R_zone_peer_max"
    notes: "F1.1 corollary to F1's peak form (revised 2026-04-23; T4 drift note + H-F1.1 test-type correction added 2026-04-23 round-2 per Blocker 11 + Blocker 1; AC IDs updated 2026-04-23 round-5 consistency-check — H-F1.1 split into H-F1.1a + H-F1.1b in round-3, with pre-specified Form L/Form U fallbacks in round-4). R_zone_peer_max is the largest OTHER zone in the manifest, not the zone being ceiling-computed. General constraint: sum of the two largest zone texture footprints <= R_cap - R_always_at_current_tier (305 MB at MVP; ~297 MB at T4). At MVP (two zones): HauntMansion ceiling = 350 - 45 - 125 = 180 MB; CityHub ceiling = 350 - 45 - 140 = 165 MB. Output_range max = 165 MB (MVP binding ceiling); previous [0, 305] was a validator false-pass trap because 305 is only reachable when the peer zone is 0 MB. T4 SCALABILITY DRIFT (Blocker 11, performance-analyst P1 HIGH): R_always is NOT fixed across tiers. Under D1 metadata-only ZoneIdle each ZoneIdle entry adds <=2 MB (manifest + optional NavMeshData ref) to AlwaysLoaded baseline. At T4 (4 idle + 1 active), R_always ~= 53 MB and peer-sum ceiling tightens to ~297 MB. Art-team budgets inherited from T1 will silently produce build-blocking F1 violations at T4 if not re-evaluated when new zones are added to the manifest. Informs H-F1.1a (local per-zone budget) and H-F1.1b (global pairwise invariant) — both Dev-build smoke, PlayMode Memory Profiler with Texture2D filter by zone bundle label as primary method, OR Fallback Form L (load-side delta: post-ZoneActive minus pre-ZoneLoading baseline) if per-label isolation is unavailable at Unity 6.3 per ADR-tba-4(d). Note: Addressable bundle size on disk is NOT the gate — the gate is resident texture memory. Reclassified 2026-04-23 round-2 per Blocker 1: the prior Editor-validation classification was incorrect because Memory Profiler requires a running PlayMode session."
    added: 2026-04-22
    revised: 2026-04-23

  - name: stream_ahead_trigger_distance
    status: active
    source: design/gdd/world-structure.md
    referenced_by:
      - design/gdd/world-structure.md
    variables: [V_max, T_load_s, D_margin]
    output_range: [0, 40]    # meters (ADVISORY only, not enforced; >40 indicates zone-split recommended per F2 extreme-behavior note)
    expression: "D_trigger = V_max * T_load_s + D_margin"
    notes: "F2 level-design constraint (variable renamed 2026-04-23 — T_load split into T_load_s (seconds, F2) and T_load_ms (milliseconds, F3) to resolve Blocker 4 unit collision). MVP example: 5 m/s * 3 s + 2 m = 17 m. The 40 m upper bound is advisory only, not enforced — it signals a zone-split is recommended. Values <5 m are a design smell. Informs H-F2 Editor-validation (level-validator Editor menu script)."
    added: 2026-04-22
    revised: 2026-04-23

  - name: zone_transition_total_time_budget
    status: active
    source: design/gdd/world-structure.md
    referenced_by:
      - design/gdd/world-structure.md
    variables: [T_save, T_load_ms, T_activate, T_unload_async]
    output_range: [0, 5000]   # ms; felt + stream-ahead bound (T_save + T_load_ms + T_activate < zone_overrun_window_seconds * 1000). T_unload_async is post-felt and unbounded.
    expression: "T_transition = T_save + T_load_ms + T_activate + T_unload_async"
    notes: "F3 time-budget accountability identity (revised 2026-04-23 — variable renamed to T_load_ms; output_range was [0, 0] which was validator-unparseable; now [0, 5000] bounds the felt + stream-ahead portion). Per Rule 5 two-phase split: T_save + T_load_ms occur during stream-ahead sub-phase (player free); only T_activate is felt as position-lock (<=100 ms commit). T_unload_async is post-felt and unbounded. Stream-ahead target < zone_overrun_window_seconds * 1000 (default 5000 ms). Informs H-F3 Profiled playtest (min-spec manual run)."
    added: 2026-04-22
    revised: 2026-04-23

  - name: corpse_run_zone_retention_memory_cost
    status: deprecated
    source: design/gdd/world-structure.md
    referenced_by:
      - design/gdd/world-structure.md
    variables: [R_cap, R_always, R_corpse_zone]
    output_range: [0, 305]   # MB (historical)
    expression: "R_available_active = R_cap - R_always - R_corpse_zone"
    notes: "DEPRECATED 2026-04-23 under D1 metadata-only ZoneIdle. R_corpse_zone is now always 0 — corpse retention became timestamp-only via CorpseRecord (zoneId + Vector3 position + expiry_timestamp_utc persisted in save state; no texture retention). See world-structure.md §Corpse Retention Model (replaces F4 formula). AC IDs updated 2026-04-23 round-5 consistency-check: the original H-F4 criterion was split across rounds 2 and 3 into four corpse-retention ACs — H-F4a (texture release, Dev-build smoke with Form U unload-side delta fallback), H-F4b-schema (CorpseRecord schema, Unit), H-F4b-cadence (independent countdown cadence, Integration PlayMode with programmatic service-field access), H-F4c (re-entry path integrity, Integration PlayMode event-log assertion). The replacement set validates metadata/timestamp behavior rather than this deprecated memory formula. Preserved here with status=deprecated per registry rule (never delete entries)."
    added: 2026-04-22
    revised: 2026-04-23

  - name: npc_schedule_catchup_steps
    status: active
    source: design/gdd/npc-system.md
    referenced_by:
      - design/gdd/npc-system.md
    variables: [real_elapsed_seconds, session_catchup_max_real_seconds_default, npc_catchup_step_seconds]
    output_range: [0, 20160]   # steps at 30s safe-range minimum quantum and 7-day World Structure clamp
    expression: "floor(clamp(real_elapsed_seconds, 0, session_catchup_max_real_seconds_default) / npc_catchup_step_seconds)"
    notes: "T1 NPC System deterministic SessionResumeEvent handler formula. NPC System evaluates final schedule state in data only; it does not simulate visible per-step movement while zones are idle. Pairs with World Structure Rule 13 and the session_catchup_max_real_seconds_default constant. Output max is 20160 at the 30s safe-range minimum quantum; default 60s quantum produces 10080 steps."
    added: 2026-04-24
    revised: ""

  - name: world_time_seconds_derivation
    status: active
    source: design/gdd/day-night-cycle.md
    referenced_by:
      - design/gdd/day-night-cycle.md
    variables: [now_utc_seconds, PROJECT_WORLD_EPOCH_UTC_seconds, time_scale_world, world_clock_offset_seconds, day_length_seconds]
    output_range: [0, 14400]   # seconds; max follows day_length_seconds safe-range maximum, exclusive at runtime
    expression: "((now_utc_seconds - PROJECT_WORLD_EPOCH_UTC_seconds) * time_scale_world + world_clock_offset_seconds) mod day_length_seconds"
    notes: "T1 Day/Night canonical local world-clock derivation. Used for first-run bootstrap, active-play derivation, and SessionResumeEvent handling. Output is always in [0, day_length_seconds). Default project epoch is 2026-01-01T00:00:00Z (1767225600). No persisted Day/Night clock field is used."
    added: 2026-04-24
    revised: ""

  - name: world_clock_advance
    status: deprecated
    source: design/gdd/day-night-cycle.md
    referenced_by:
      - design/gdd/day-night-cycle.md
    variables: [world_time_seconds_current, delta_real_seconds, time_scale_world, day_length_seconds]
    output_range: [0, 14400]
    expression: "(world_time_seconds_current + (delta_real_seconds * time_scale_world)) mod day_length_seconds"
    notes: "Deprecated 2026-04-24 after Day/Night Option B clock bootstrap decision. Replaced by world_time_seconds_derivation so Day/Night derives from UTC + fixed project epoch instead of accumulating frame/resume deltas."
    added: 2026-04-24
    revised: 2026-04-24

  - name: phase_from_world_time
    status: active
    source: design/gdd/day-night-cycle.md
    referenced_by:
      - design/gdd/day-night-cycle.md
    variables: [world_time_seconds, phase_start_seconds, phase_end_seconds, phase_id]
    output_range: [0, 3]   # enum ordinal for DawnTransition, InnHours, DuskTransition, CourtHours
    expression: "phase_id = first phase where phase_start_seconds <= world_time_seconds < phase_end_seconds"
    notes: "T1 Day/Night phase resolution formula. Authored phase ranges must cover the full day exactly once with no gaps or overlaps. Default enum order: 0 DawnTransition, 1 InnHours, 2 DuskTransition, 3 CourtHours."
    added: 2026-04-24
    revised: ""

  - name: resume_clock_advance
    status: deprecated
    source: design/gdd/day-night-cycle.md
    referenced_by:
      - design/gdd/day-night-cycle.md
    variables: [real_elapsed_seconds, session_catchup_max_real_seconds_default, time_scale_world, world_time_seconds_before_resume]
    output_range: [0, 14400]   # seconds; world_time_seconds_after_resume range follows day_length_seconds safe-range maximum, exclusive at runtime
    expression: "resume_delta_seconds = clamp(real_elapsed_seconds, 0, session_catchup_max_real_seconds_default); world_time_seconds_after_resume = (world_time_seconds_before_resume + (resume_delta_seconds * time_scale_world)) mod day_length_seconds"
    notes: "Deprecated 2026-04-24 after Day/Night Option B clock bootstrap decision. Day/Night no longer adds clamped elapsed time to a prior persisted or in-memory clock; SessionResumeEvent now triggers world_time_seconds_derivation from UTC + fixed project epoch."
    added: 2026-04-24
    revised: 2026-04-24

