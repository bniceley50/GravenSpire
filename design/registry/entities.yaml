# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: texture_residency_cap
    status: active
    source: design/art/art-bible.md   # originating §8.9 lock
    referenced_by:
      - design/art/art-bible.md
      - design/gdd/world-structure.md
    value: 350
    unit: MB
    notes: "Hard cap during normal play. Single Active Zone Invariant (world-structure Rule 3) depends on this. Not tunable."
    added: 2026-04-22
    revised: ""

  - name: corpse_run_zone_retention_seconds_default
    status: active
    source: design/gdd/world-structure.md
    referenced_by:
      - design/gdd/world-structure.md
      - design/gdd/save-load-persistence.md
    value: 300
    unit: seconds
    notes: "Initial pin from Section G tuning knob. Revisit at T1 playtest against 75th-percentile observed corpse-run durations. Under D1 metadata-only ZoneIdle (revised 2026-04-23), this knob is a pure gameplay/UX lever — it controls CorpseRecord.expiry_timestamp_utc only. No memory cost (see deprecated corpse_run_zone_retention_memory_cost entry)."
    added: 2026-04-22
    revised: 2026-04-23

  - name: save_mutex_max_ms
    status: active
    source: design/gdd/world-structure.md   # Rule 12 + Section G
    referenced_by:
      - design/gdd/world-structure.md
      - design/gdd/save-load-persistence.md
    value: 150
    unit: milliseconds
    notes: "Hard timeout for SaveCheckpointing per world-structure.md Rule 12 (SaveTimedOutEvent fires on elapse). Reproduced (not redesigned) by save-load-persistence.md per §Overview non-negotiable #3, Rule 5 (Transition Save trigger only — other save paths bounded by caller UX, not Rule 12), Rule 8 (SaveWriteConfirmed must dispatch synchronously same-frame to fit within this window), and §Edge Cases A4 (late SaveWriteConfirmed after deadline elapse → WS routes to ZoneError; on-disk write may still succeed). Save/Load AC H-SL-R8 verifies same-frame dispatch behavior; H-SL-CS-WS-SavePath verifies end-to-end Min-Spec performance against this window."
    added: 2026-04-22
    revised: 2026-04-23

  - name: zone_overrun_window_seconds
    status: active
    source: design/gdd/world-structure.md   # Section G tuning knob + F1 R_peak overrun window
    referenced_by:
      - design/gdd/world-structure.md
      - design/gdd/menus-settings.md
    value: 5
    unit: seconds
    notes: "Max allowed F1 R_peak transient-overlap duration during ZoneLoading stream-ahead sub-phase. ZoneLoadOverrunEvent fires on elapse for Menus & Settings (non-blocking UI indicator). Menus & Settings consumes this for the Zone Overrun Visibility Gate. Save/Load GDD (approved 2026-04-23) does not reference this constant; no Save/Load reverse-listing needed. Registered 2026-04-22 design review (#6) to pre-empt downstream cross-GDD drift."
    added: 2026-04-22
    revised: 2026-04-24

  - name: session_catchup_max_real_seconds_default
    status: active
    source: design/gdd/world-structure.md   # Rule 13 + Section G tuning knob
    referenced_by:
      - design/gdd/world-structure.md
      - design/gdd/save-load-persistence.md
      - design/gdd/npc-system.md
    value: 604800
    unit: seconds
    notes: "Rule 13 elapsed-time clamp for SessionResumeEvent (added 2026-04-23 per D3 + creative-director binding). 604800 s = 7 days, aligned with game-concept.md unique-hook 'log off for a week'. Safe range 3600 s (1 hour) – 2592000 s (30 days). Negative deltas (clock skew) clamp to 0. Handler-absent-default is no-catch-up (not partial). NPC System references this for npc_schedule_catchup_steps. Day/Night no longer references this constant after the 2026-04-24 UTC-derivation decision; its handler uses SessionResumeEvent for ordering only. Faction Sim / Faction Events / Dialogue GDDs will reference once authored — add to referenced_by at that time. DECISIONS.md D007 follow-up entry planned after WS re-review passes per D6."
    added: 2026-04-23
    revised: 2026-04-24

  - name: PROJECT_WORLD_EPOCH_UTC_seconds
