# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: npc_source_lifecycle_to_progression_registry
    status: proposed
    pattern: direct_call
    producer: NPC System
    consumers:
      - Character Progression
    adr: docs/architecture/adr-0001-xp-source-lifecycle-registry.md
    signal_signature: "RegisterXpSourceLifecycle(zoneId, defeated_source_ref, source_lifecycle_token, source_lifecycle_state, source_lifecycle_token_policy)"
    notes: "Synchronous lifecycle hook used before XP eligibility and during the same kill-resolution phase that captures XpAwardResolutionSnapshot."
    referenced_by:
      - docs/architecture/adr-0001-xp-source-lifecycle-registry.md
      - design/gdd/character-progression.md
      - design/gdd/npc-system.md
    added: 2026-04-26
    revised: ""

  - contract: save_stability_barrier_protocol
    status: proposed
    pattern: direct_call
    producer: "Save / Load & Persistence"
    consumers:
      - Character Progression
      - NPC System
      - Future downstream save clients with transient save-unsafe state
    adr: docs/architecture/adr-0002-save-stability-barrier-protocol.md
    method_signature: "SaveStabilityBarrier(request: SaveStabilityBarrierRequest) -> SaveStabilityBarrierResult"
    notes: "Save/Load invokes declared downstream barriers before reading guarded payloads; Stable returns a scoped read_token, while Unresolved/Failed causes no bytes to be written."
    referenced_by:
      - docs/architecture/adr-0002-save-stability-barrier-protocol.md
      - design/gdd/save-load-persistence.md
      - design/gdd/character-progression.md
      - design/gdd/npc-system.md
    added: 2026-04-26
    revised: ""

  - contract: xp_source_lifecycle_consistency_barrier_group
    status: proposed
    pattern: direct_call
    producer: "Save / Load & Persistence"
    consumers:
      - Character Progression
      - NPC System
    adr: docs/architecture/adr-0002-save-stability-barrier-protocol.md
    method_signature: "ProgressionSaveBarrier(request) + NpcSourceLifecycleSaveBarrier(request) must both return Stable before either guarded payload serializes."
    notes: "Post-award XP and defeated-source lifecycle state are serialized together or not at all."
    referenced_by:
      - docs/architecture/adr-0002-save-stability-barrier-protocol.md
      - docs/architecture/adr-0001-xp-source-lifecycle-registry.md
      - design/gdd/save-load-persistence.md
      - design/gdd/character-progression.md
      - design/gdd/npc-system.md
    added: 2026-04-26
    revised: ""

  - contract: combat_progression_baseline_snapshot
    status: proposed
    pattern: direct_call
    producer: Character Progression
    consumers:
      - Combat Core
      - "Save / Load & Persistence"
    adr: docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
    method_signature: "GetCombatProgressionBaselineSnapshot(local_character_id) -> CombatProgressionBaselineSnapshot"
    notes: "Combat's only legal Character Progression baseline in T1; carries combat_actor_level = current_level plus permanent max health/mana and revision metadata."
    referenced_by:
      - docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
      - design/gdd/character-progression.md
      - design/gdd/save-load-persistence.md
      - design/gdd/combat-core.md
    added: 2026-04-26
    revised: ""

  - contract: progression_presentation_read_model_t1
    status: proposed
    pattern: direct_call
    producer: Character Progression
    consumers:
      - Layer 1 HUD
      - "Menus & Settings"
    adr: docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
    method_signature: "GetProgressionPresentationReadModel_T1(local_character_id) -> ProgressionPresentationReadModel_T1"
    notes: "Future UI/Menu read model for visible_level and current XP band display; not a Combat input and not available as a generic baseline."
    referenced_by:
      - docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
      - design/gdd/character-progression.md
      - design/gdd/systems-index.md
    added: 2026-04-26
    revised: ""

  - contract: spell_eligibility_read_model_t1
    status: proposed
    pattern: direct_call
    producer: Character Progression
    consumers:
      - Spell Memorization
      - Class Design
    adr: docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
    method_signature: "GetSpellEligibilityReadModel_T1(local_character_id) -> SpellEligibilityReadModel_T1"
    notes: "Eligibility-tier read model only; contains no spell ids, learned abilities, spellbook state, memorized slots, vendors, drops, UI, VFX, or spell effects."
    referenced_by:
      - docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
      - design/gdd/character-progression.md
      - design/gdd/systems-index.md
    added: 2026-04-26
    revised: ""

