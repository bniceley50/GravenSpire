    owner_system: NPC System
    adr: docs/architecture/adr-0001-xp-source-lifecycle-registry.md
    interface: "NpcSourceLifecycleRecord(zoneId, defeated_source_ref, source_lifecycle_token, source_lifecycle_state, source_lifecycle_token_policy, respawn_or_availability_timing_key)"
    write_access: NPC-System-only
    referenced_by:
      - docs/architecture/adr-0001-xp-source-lifecycle-registry.md
