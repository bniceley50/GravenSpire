# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: combat_actor_id_as_xp_identity
    status: proposed
    description: "Combat runtime actor ids must not be used in XP award identity, dedupe keys, save data, or source lifecycle records."
    why: "Combat actor ids are transient runtime/session identifiers; XP awards require stable source refs and source lifecycle tokens so duplicates and respawns are deterministic."
    adr: docs/architecture/adr-0001-xp-source-lifecycle-registry.md
    referenced_by:
      - docs/architecture/adr-0001-xp-source-lifecycle-registry.md
      - design/gdd/character-progression.md
      - design/gdd/combat-core.md
    added: 2026-04-26

  - pattern: live_npc_state_xp_lookup_after_death
    status: proposed
    description: "Character Progression must not resolve XP metadata by querying mutable live NPC or spawn runtime state after Combat kill credit has fired."
    why: "Cleanup, despawn, or respawn can replace the source occupant; XP must come from the same-dispatch immutable XpAwardResolutionSnapshot."
    adr: docs/architecture/adr-0001-xp-source-lifecycle-registry.md
    referenced_by:
      - docs/architecture/adr-0001-xp-source-lifecycle-registry.md
      - design/gdd/character-progression.md
      - design/gdd/npc-system.md
    added: 2026-04-26

  - pattern: t1_nonrepeatable_firstkill_shipping_rows
    status: proposed
    description: "T1 shipping ProgressionXpSourceRefLookup rows must not use repeatability_class = NonRepeatableFirstKill."
    why: "NonRepeatableFirstKill needs durable per-character claim persistence, which ADR-0001 intentionally defers to a later decision."
    adr: docs/architecture/adr-0001-xp-source-lifecycle-registry.md
    referenced_by:
      - docs/architecture/adr-0001-xp-source-lifecycle-registry.md
      - design/gdd/character-progression.md
    added: 2026-04-26

  - pattern: direct_save_read_of_transient_downstream_state
    status: proposed
    description: "Save/Load must not read guarded downstream payloads directly while the owner can be in a transient save-unsafe state."
    why: "Downstream owners must settle or reject pending transactions through declared save-stability barriers before Save/Load reads their payloads."
    adr: docs/architecture/adr-0002-save-stability-barrier-protocol.md
    referenced_by:
      - docs/architecture/adr-0002-save-stability-barrier-protocol.md
      - design/gdd/save-load-persistence.md
      - design/gdd/character-progression.md
      - design/gdd/npc-system.md
    added: 2026-04-26

  - pattern: unbounded_downstream_save_wait
    status: proposed
    description: "Save/Load and downstream barrier owners must not wait indefinitely for a save-stability barrier to settle."
    why: "Every barrier request needs an effective monotonic deadline; unresolved barriers fail loudly so transition saves do not hang or consume World Structure's save_mutex_max_ms window."
    adr: docs/architecture/adr-0002-save-stability-barrier-protocol.md
    referenced_by:
      - docs/architecture/adr-0002-save-stability-barrier-protocol.md
      - design/gdd/save-load-persistence.md
      - design/gdd/world-structure.md
    added: 2026-04-26

  - pattern: partial_group_payload_serialization
    status: proposed
    description: "When a declared barrier group guards cross-system consistency, Save/Load must not serialize any member payload unless every member barrier returns Stable."
    why: "Partial serialization can persist post-award XP without matching source lifecycle state, or source lifecycle death without matching progression state."
    adr: docs/architecture/adr-0002-save-stability-barrier-protocol.md
    referenced_by:
      - docs/architecture/adr-0002-save-stability-barrier-protocol.md
      - docs/architecture/adr-0001-xp-source-lifecycle-registry.md
      - design/gdd/save-load-persistence.md
      - design/gdd/character-progression.md
      - design/gdd/npc-system.md
    added: 2026-04-26

  - pattern: generic_all_consumer_progression_baseline_snapshot
    status: proposed
    description: "Do not expose or consume a generic all-consumer ProgressionBaselineSnapshot for Combat, UI, spell systems, or future consumers."
    why: "ADR-0003 requires consumer-scoped immutable read models so consumers cannot depend on unrelated fields or carry hidden coupling through a fat snapshot."
    adr: docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
    referenced_by:
      - docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
      - design/gdd/character-progression.md
      - design/gdd/save-load-persistence.md
      - design/gdd/combat-core.md
    added: 2026-04-26

  - pattern: combat_consuming_visible_level
    status: proposed
    description: "Combat Core must not consume Character Progression visible_level as a combat actor level input."
    why: "visible_level is a presentation field; ADR-0003 maps Combat's level input to CombatProgressionBaselineSnapshot.combat_actor_level, which equals current_level in T1."
    adr: docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
    referenced_by:
      - docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
      - design/gdd/character-progression.md
      - design/gdd/combat-core.md
    added: 2026-04-26

  - pattern: ui_or_spell_consumer_reading_combat_snapshot
    status: proposed
    description: "UI, Menus, Spell Memorization, Class Design, vendors, drops, and other non-Combat consumers must not read CombatProgressionBaselineSnapshot for progression data."
    why: "CombatProgressionBaselineSnapshot is scoped to Combat actor hydration and max-resource baselines; UI and spell systems have separate read models with separate ownership rules."
    adr: docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
    referenced_by:
      - docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
      - design/gdd/character-progression.md
      - design/gdd/systems-index.md
    added: 2026-04-26

  - pattern: consumer_mutating_progression_snapshot
    status: proposed
    description: "Consumers must not mutate Character Progression state through progression snapshots or read models."
    why: "ADR-0003 defines immutable consumer-scoped read models; Character Progression remains the only writer of progression level, permanent baselines, and spell eligibility state."
    adr: docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
    referenced_by:
      - docs/architecture/adr-0003-progression-baseline-snapshot-contract.md
      - design/gdd/character-progression.md
    added: 2026-04-26

