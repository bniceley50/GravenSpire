# Governance drift check, powered by govctl (https://github.com/bniceley50/govctl).
# Validates that DECISIONS.md and the codebase have not drifted apart, on every PR and push to main.
name: Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so govctl can scan commit messages for D-refs
      - name: Validate governance stack
        uses: bniceley50/govctl/.github/actions/govctl-validate@v0.3.2
        with:
          path: "."
          strict: "true"
